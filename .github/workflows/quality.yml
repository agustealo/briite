name: Quality Gate

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - 'modernize/**'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.1'
          - '8.3'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -path './vendor' -prune -o -name '*.php' -print0)

  php-compatibility:
    name: PHP 7.4-8.5 compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-lock

      - name: Install development tools
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPCompatibilityWP
        run: composer phpcompat

  wordpress-standards-modernized:
    name: WordPress standards - modernized surface
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install development tools
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Enforce WPCS on compatibility slice
        run: >-
          vendor/bin/phpcs --standard=phpcs.xml.dist
          archive.php
          content-search.php
          footer.php
          functions.php
          header.php
          inc/profile.php
          search.php
          sidebar.php
          single.php

  wordpress-standards-audit:
    name: WordPress standards - legacy backlog audit
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install development tools
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run full-repository WPCS audit
        run: composer lint
