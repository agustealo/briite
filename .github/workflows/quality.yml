name: Quality Gate

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - 'modernize/**'
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.1'
          - '8.3'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -path './vendor' -prune -o -name '*.php' -print0)

  javascript-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check theme JavaScript
        run: node --check js/theme.js

  php-compatibility:
    name: PHP 7.4-8.5 compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-lock

      - name: Install development tools
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPCompatibilityWP
        run: composer phpcompat

  wordpress-standards:
    name: WordPress coding standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install development tools
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Enforce WPCS on the full repository
        run: composer lint

  release-package:
    name: Consumer release package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Build consumer package
        run: composer package

      - name: Verify release archive contents
        shell: bash
        run: |
          set -euo pipefail
          THEME_ZIP="$(find dist -maxdepth 1 -type f -name 'briite-*.zip' -print -quit)"
          CHECKSUM_FILE="${THEME_ZIP}.sha256"
          test -n "${THEME_ZIP}"
          test -f "${CHECKSUM_FILE}"
          unzip -t "${THEME_ZIP}"
          grep -q 'briite/readme.txt' < <(unzip -Z1 "${THEME_ZIP}")
          grep -q 'briite/LICENSE.txt' < <(unzip -Z1 "${THEME_ZIP}")

      - name: Upload consumer package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: briite-release-${{ github.sha }}
          path: |
            dist/briite-*.zip
            dist/briite-*.zip.sha256
          if-no-files-found: error
          compression-level: 0

  wordpress-runtime:
    name: WordPress 7.1.1 runtime smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
          tools: wp-cli

      - name: Build consumer package
        run: bash tools/build-release.sh

      - name: Install WordPress 7.1.1
        shell: bash
        run: |
          set -euo pipefail
          wp core download --version=7.1.1 --path=/tmp/wordpress --force
          wp config create \
            --path=/tmp/wordpress \
            --dbname=wordpress_test \
            --dbuser=wordpress \
            --dbpass=wordpress \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          wp core install \
            --path=/tmp/wordpress \
            --url=http://127.0.0.1:8080 \
            --title='Briite CI' \
            --admin_user=admin \
            --admin_password='briite-ci-password' \
            --admin_email=ci@example.com \
            --skip-email
          wp config set WP_DEBUG true --raw --path=/tmp/wordpress
          wp config set WP_DEBUG_LOG true --raw --path=/tmp/wordpress
          wp config set WP_DEBUG_DISPLAY false --raw --path=/tmp/wordpress

      - name: Install and activate packaged Briite
        shell: bash
        run: |
          set -euo pipefail
          THEME_ZIP="$(find dist -maxdepth 1 -type f -name 'briite-*.zip' -print -quit)"
          test -n "${THEME_ZIP}"
          wp theme install "${THEME_ZIP}" --force --activate --path=/tmp/wordpress

      - name: Verify preserved theme contracts
        shell: bash
        run: |
          set -euo pipefail
          wp eval --path=/tmp/wordpress '
            if ( "Briite" !== wp_get_theme()->get( "Name" ) ) {
              fwrite( STDERR, "Unexpected active theme name.\n" );
              exit( 1 );
            }
            if ( ! current_theme_supports( "title-tag" ) || ! current_theme_supports( "post-thumbnails" ) ) {
              fwrite( STDERR, "Required theme support is missing.\n" );
              exit( 1 );
            }
            if ( ! current_theme_supports( "editor-styles" ) ) {
              fwrite( STDERR, "Editor styles support is missing.\n" );
              exit( 1 );
            }
            if ( current_theme_supports( "wp-block-styles" ) || current_theme_supports( "align-wide" ) ) {
              fwrite( STDERR, "Unexpected front-end block-layout opt-in detected.\n" );
              exit( 1 );
            }
            if ( ! function_exists( "smashing_jpeg_quality" ) ) {
              fwrite( STDERR, "Historical JPEG quality compatibility callback is missing.\n" );
              exit( 1 );
            }
            if ( false !== has_filter( "wp_editor_set_quality", "smashing_jpeg_quality" ) || false !== has_filter( "jpeg_quality", "smashing_jpeg_quality" ) ) {
              fwrite( STDERR, "Retired Briite global JPEG quality override is still registered.\n" );
              exit( 1 );
            }
            global $editor_styles;
            foreach ( array( "css/fonts.css", "css/editor.css" ) as $editor_style ) {
              if ( ! is_array( $editor_styles ) || ! in_array( $editor_style, $editor_styles, true ) ) {
                fwrite( STDERR, "Required editor stylesheet missing: {$editor_style}\n" );
                exit( 1 );
              }
            }
            $menus = get_registered_nav_menus();
            if ( ! isset( $menus["primary"] ) ) {
              fwrite( STDERR, "Primary menu location is missing.\n" );
              exit( 1 );
            }
            global $wp_registered_sidebars;
            foreach ( array( "bottom-widget-1", "bottom-widget-2", "bottom-widget-3", "bottom-widget-4" ) as $sidebar_id ) {
              if ( ! isset( $wp_registered_sidebars[ $sidebar_id ] ) ) {
                fwrite( STDERR, "Historical widget area missing: {$sidebar_id}\n" );
                exit( 1 );
              }
            }
          '

      - name: Seed representative content and navigation
        id: seed
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_POST_IDS=$(wp post list \
            --path=/tmp/wordpress \
            --post_type=post \
            --post_status=publish \
            --format=ids)
          if [ -n "$DEFAULT_POST_IDS" ]; then
            wp post delete $DEFAULT_POST_IDS --force --path=/tmp/wordpress >/dev/null
          fi

          OLDER_POST_ID=$(wp post create \
            --path=/tmp/wordpress \
            --post_type=post \
            --post_status=publish \
            --post_date='2026-01-01 00:00:00' \
            --post_title='Briite Older Smoke Post' \
            --post_content='Briite older pagination smoke content.' \
            --porcelain)
          POST_ID=$(wp post create \
            --path=/tmp/wordpress \
            --post_type=post \
            --post_status=publish \
            --post_date='2026-01-02 00:00:00' \
            --post_title='Briite Smoke Post' \
            --post_content='Briite compatibility runtime smoke content.' \
            --porcelain)
          PAGE_ID=$(wp post create \
            --path=/tmp/wordpress \
            --post_type=page \
            --post_status=publish \
            --post_title='Briite Smoke Page' \
            --post_content='Briite page compatibility smoke content.' \
            --porcelain)
          CHILD_PAGE_ID=$(wp post create \
            --path=/tmp/wordpress \
            --post_type=page \
            --post_status=publish \
            --post_title='Briite Child Page' \
            --post_content='Briite child menu compatibility smoke content.' \
            --porcelain)
          CATEGORY_ID=$(wp term create category 'Briite Smoke Category' \
            --path=/tmp/wordpress \
            --porcelain)
          wp post term add "${POST_ID}" category "${CATEGORY_ID}" --path=/tmp/wordpress
          wp option update posts_per_page 1 --path=/tmp/wordpress >/dev/null

          MENU_ID=$(wp menu create 'Briite Smoke Menu' --path=/tmp/wordpress --porcelain)
          PARENT_ITEM_ID=$(wp menu item add-post "${MENU_ID}" "${PAGE_ID}" \
            --path=/tmp/wordpress \
            --title='Briite Parent Menu Item' \
            --porcelain)
          wp menu item add-post "${MENU_ID}" "${CHILD_PAGE_ID}" \
            --path=/tmp/wordpress \
            --title='Briite Child Menu Item' \
            --parent-id="${PARENT_ITEM_ID}" \
            --porcelain >/dev/null
          wp menu location assign "${MENU_ID}" primary --path=/tmp/wordpress

          printf 'post_id=%s\nolder_post_id=%s\npage_id=%s\ncategory_id=%s\n' \
            "${POST_ID}" "${OLDER_POST_ID}" "${PAGE_ID}" "${CATEGORY_ID}" >> "${GITHUB_OUTPUT}"

      - name: Render representative front-end routes
        shell: bash
        env:
          POST_ID: ${{ steps.seed.outputs.post_id }}
          OLDER_POST_ID: ${{ steps.seed.outputs.older_post_id }}
          PAGE_ID: ${{ steps.seed.outputs.page_id }}
          CATEGORY_ID: ${{ steps.seed.outputs.category_id }}
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 -t /tmp/wordpress >/tmp/briite-php-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 20 ]; then
              cat /tmp/briite-php-server.log
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error \
            'http://127.0.0.1:8080/wp-content/themes/briite/css/bootstrap-3.3.7.min.css' \
            > /tmp/briite-bootstrap.css
          grep -q 'Bootstrap v3.3.7' /tmp/briite-bootstrap.css

          curl --fail --silent --show-error \
            'http://127.0.0.1:8080/wp-content/themes/briite/css/compat.css' \
            > /tmp/briite-compat.css
          grep -q 'menu-item-has-children:focus-within' /tmp/briite-compat.css
          grep -q 'page_item_has_children:focus-within' /tmp/briite-compat.css

          curl --fail --silent --show-error \
            'http://127.0.0.1:8080/wp-content/themes/briite/fonts/glyphicons-halflings-regular.woff2' \
            > /dev/null

          routes=(
            "/"
            "/?p=${POST_ID}"
            "/?page_id=${PAGE_ID}"
            "/?s=Briite"
            "/?cat=${CATEGORY_ID}"
            "/?paged=2"
          )

          index=0
          for route in "${routes[@]}"; do
            output="/tmp/briite-route-${index}.html"
            curl --fail --silent --show-error "http://127.0.0.1:8080${route}" > "${output}"
            grep -q '</html>' "${output}"
            grep -q '/js/theme.js' "${output}"
            grep -q '/css/bootstrap-3.3.7.min.css' "${output}"
            ! grep -q '/css/editor.css' "${output}"
            ! grep -q 'maxcdn.bootstrapcdn.com' "${output}"
            index=$(( index + 1 ))
          done

          grep -q 'menu-item-has-children' /tmp/briite-route-0.html
          grep -q 'class="sub-menu"' /tmp/briite-route-0.html
          grep -q 'Briite Child Menu Item' /tmp/briite-route-0.html
          grep -q 'Briite Smoke Post' /tmp/briite-route-0.html
          grep -q 'navigation paging-navigation' /tmp/briite-route-0.html
          grep -q 'Older posts' /tmp/briite-route-0.html
          grep -q 'Briite Older Smoke Post' /tmp/briite-route-5.html
          grep -q 'navigation paging-navigation' /tmp/briite-route-5.html
          grep -q 'Newer posts' /tmp/briite-route-5.html

          not_found_output=/tmp/briite-route-404.html
          not_found_status=$(curl \
            --silent \
            --show-error \
            --output "${not_found_output}" \
            --write-out '%{http_code}' \
            'http://127.0.0.1:8080/?p=999999')
          test "${not_found_status}" = '404'
          grep -q '</html>' "${not_found_output}"
          grep -q '/js/theme.js' "${not_found_output}"
          grep -q '/css/bootstrap-3.3.7.min.css' "${not_found_output}"
          ! grep -q '/css/editor.css' "${not_found_output}"
          ! grep -q 'maxcdn.bootstrapcdn.com' "${not_found_output}"

      - name: Fail on WordPress runtime diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/wordpress/wp-content/debug.log ] && [ -s /tmp/wordpress/wp-content/debug.log ]; then
            echo 'WordPress debug.log is not empty:'
            cat /tmp/wordpress/wp-content/debug.log
            exit 1
          fi

          if [ -f /tmp/briite-php-server.log ] && grep -Eqi 'PHP (Warning|Notice|Deprecated|Fatal error|Parse error)|Uncaught (Error|Exception)' /tmp/briite-php-server.log; then
            echo 'PHP runtime diagnostics detected:'
            cat /tmp/briite-php-server.log
            exit 1
          fi
