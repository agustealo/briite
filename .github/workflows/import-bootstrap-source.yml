name: Import Bootstrap 3.3.7 source

on:
  push:
    branches:
      - fix/vendor-bootstrap-source
    paths:
      - '.github/workflows/import-bootstrap-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/vendor-bootstrap-source

      - name: Import exact Bootstrap 3.3.7 source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL='https://raw.githubusercontent.com/twbs/bootstrap/0b9c4a4007c44201dce9a6cc1a38407005c26c86/dist/css/bootstrap.css'
          EXPECTED_BLOB_SHA='6167622cecfb5c0f04156363565e3d4109fc55c5'
          TARGET='css/bootstrap-3.3.7.css'

          curl --fail --silent --show-error --location "${SOURCE_URL}" --output "${TARGET}"

          size=$(wc -c < "${TARGET}" | tr -d ' ')
          actual_blob_sha=$(
            {
              printf 'blob %s\0' "${size}"
              cat "${TARGET}"
            } | sha1sum | awk '{print $1}'
          )

          if [ "${actual_blob_sha}" != "${EXPECTED_BLOB_SHA}" ]; then
            echo "Bootstrap source blob mismatch: expected ${EXPECTED_BLOB_SHA}, got ${actual_blob_sha}" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${TARGET}"
          git commit -m 'Vendor Bootstrap 3.3.7 unminified source'
          git push origin HEAD:fix/vendor-bootstrap-source
