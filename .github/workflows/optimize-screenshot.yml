name: Optimize Briite screenshot

on:
  push:
    branches:
      - fix/theme-check-gate
    paths:
      - .github/workflows/optimize-screenshot.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/theme-check-gate
          fetch-depth: 0

      - name: Optimize screenshot without changing pixels
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import binascii
          import struct
          import zlib
          from pathlib import Path

          path = Path('screenshot.png')
          source = path.read_bytes()
          original_size = len(source)
          signature = b'\x89PNG\r\n\x1a\n'

          if not source.startswith(signature):
              raise SystemExit('screenshot.png is not a PNG file')

          position = len(signature)
          ihdr = None
          compressed = bytearray()

          while position < len(source):
              length = struct.unpack('>I', source[position:position + 4])[0]
              chunk_type = source[position + 4:position + 8]
              chunk_data = source[position + 8:position + 8 + length]
              position += 12 + length

              if chunk_type == b'IHDR':
                  ihdr = chunk_data
              elif chunk_type == b'IDAT':
                  compressed.extend(chunk_data)
              elif chunk_type == b'IEND':
                  break

          if ihdr is None:
              raise SystemExit('PNG is missing IHDR')

          width, height, bit_depth, color_type, compression, filter_method, interlace = struct.unpack(
              '>IIBBBBB', ihdr
          )
          if (width, height) != (880, 660):
              raise SystemExit(f'Unexpected screenshot dimensions: {width}x{height}')
          if (bit_depth, color_type, compression, filter_method, interlace) != (8, 2, 0, 0, 0):
              raise SystemExit('Unexpected screenshot PNG format')

          bytes_per_pixel = 3
          row_bytes = width * bytes_per_pixel
          filtered = zlib.decompress(bytes(compressed))
          expected_length = height * (row_bytes + 1)
          if len(filtered) != expected_length:
              raise SystemExit('Unexpected decompressed PNG length')

          def paeth(left, above, upper_left):
              prediction = left + above - upper_left
              left_distance = abs(prediction - left)
              above_distance = abs(prediction - above)
              upper_left_distance = abs(prediction - upper_left)
              if left_distance <= above_distance and left_distance <= upper_left_distance:
                  return left
              if above_distance <= upper_left_distance:
                  return above
              return upper_left

          rows = []
          previous = bytearray(row_bytes)
          offset = 0

          for _ in range(height):
              filter_type = filtered[offset]
              encoded = filtered[offset + 1:offset + 1 + row_bytes]
              offset += row_bytes + 1
              row = bytearray(row_bytes)

              for index, value in enumerate(encoded):
                  left = row[index - bytes_per_pixel] if index >= bytes_per_pixel else 0
                  above = previous[index]
                  upper_left = previous[index - bytes_per_pixel] if index >= bytes_per_pixel else 0

                  if filter_type == 0:
                      decoded = value
                  elif filter_type == 1:
                      decoded = (value + left) & 255
                  elif filter_type == 2:
                      decoded = (value + above) & 255
                  elif filter_type == 3:
                      decoded = (value + ((left + above) // 2)) & 255
                  elif filter_type == 4:
                      decoded = (value + paeth(left, above, upper_left)) & 255
                  else:
                      raise SystemExit(f'Unsupported PNG filter: {filter_type}')

                  row[index] = decoded

              rows.append(bytes(row))
              previous = row

          def filter_row(row, previous_row, filter_type):
              output = bytearray(row_bytes)
              for index, value in enumerate(row):
                  left = row[index - bytes_per_pixel] if index >= bytes_per_pixel else 0
                  above = previous_row[index] if previous_row is not None else 0
                  upper_left = (
                      previous_row[index - bytes_per_pixel]
                      if previous_row is not None and index >= bytes_per_pixel
                      else 0
                  )

                  if filter_type == 0:
                      encoded = value
                  elif filter_type == 1:
                      encoded = (value - left) & 255
                  elif filter_type == 2:
                      encoded = (value - above) & 255
                  elif filter_type == 3:
                      encoded = (value - ((left + above) // 2)) & 255
                  else:
                      encoded = (value - paeth(left, above, upper_left)) & 255

                  output[index] = encoded
              return bytes(output)

          optimized_filtered = bytearray()
          previous_row = None

          for row in rows:
              candidates = []
              for filter_type in range(5):
                  candidate = filter_row(row, previous_row, filter_type)
                  score = sum(min(value, 256 - value) for value in candidate)
                  candidates.append((score, filter_type, candidate))

              _, filter_type, candidate = min(candidates, key=lambda item: item[0])
              optimized_filtered.append(filter_type)
              optimized_filtered.extend(candidate)
              previous_row = row

          optimized_idat = zlib.compress(bytes(optimized_filtered), 9)

          def png_chunk(chunk_type, data):
              crc = binascii.crc32(chunk_type + data) & 0xFFFFFFFF
              return struct.pack('>I', len(data)) + chunk_type + data + struct.pack('>I', crc)

          optimized = (
              signature
              + png_chunk(b'IHDR', ihdr)
              + png_chunk(b'IDAT', optimized_idat)
              + png_chunk(b'IEND', b'')
          )

          if len(optimized) >= original_size:
              raise SystemExit('PNG optimization did not reduce file size')
          if len(optimized) >= 500000:
              raise SystemExit(f'Optimized screenshot is still too large: {len(optimized)} bytes')

          # Re-read the optimized file payload and ensure its decoded RGB rows
          # are exactly the rows decoded from the source before replacing it.
          optimized_filtered_check = zlib.decompress(optimized_idat)
          check_rows = []
          previous = bytearray(row_bytes)
          offset = 0

          for _ in range(height):
              filter_type = optimized_filtered_check[offset]
              encoded = optimized_filtered_check[offset + 1:offset + 1 + row_bytes]
              offset += row_bytes + 1
              row = bytearray(row_bytes)

              for index, value in enumerate(encoded):
                  left = row[index - bytes_per_pixel] if index >= bytes_per_pixel else 0
                  above = previous[index]
                  upper_left = previous[index - bytes_per_pixel] if index >= bytes_per_pixel else 0

                  if filter_type == 0:
                      decoded = value
                  elif filter_type == 1:
                      decoded = (value + left) & 255
                  elif filter_type == 2:
                      decoded = (value + above) & 255
                  elif filter_type == 3:
                      decoded = (value + ((left + above) // 2)) & 255
                  else:
                      decoded = (value + paeth(left, above, upper_left)) & 255

                  row[index] = decoded

              check_rows.append(bytes(row))
              previous = row

          if check_rows != rows:
              raise SystemExit('Optimized screenshot pixels differ from the source')

          path.write_bytes(optimized)
          print(f'Original screenshot: {original_size} bytes')
          print(f'Optimized screenshot: {len(optimized)} bytes')
          print(f'Dimensions: {width}x{height}')
          print('Pixel data: identical')
          PY

      - name: Commit optimized screenshot and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/optimize-screenshot.yml
          git add screenshot.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Optimize directory screenshot losslessly'
          git push origin HEAD:fix/theme-check-gate
