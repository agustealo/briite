name: Translation Compatibility Gate

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: translation-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-language-pack:
    name: Legacy Kriate language-pack fallback
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
          tools: wp-cli

      - name: Build consumer package
        run: bash tools/build-release.sh

      - name: Install WordPress 7.1.1 and Briite
        shell: bash
        run: |
          set -euo pipefail
          wp core download --version=7.1.1 --path=/tmp/wordpress --force
          wp config create \
            --path=/tmp/wordpress \
            --dbname=wordpress_test \
            --dbuser=wordpress \
            --dbpass=wordpress \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          wp core install \
            --path=/tmp/wordpress \
            --url=http://127.0.0.1:8080 \
            --title='Briite Translation CI' \
            --admin_user=admin \
            --admin_password='briite-ci-password' \
            --admin_email=ci@example.com \
            --skip-email

          THEME_ZIP="$(find dist -maxdepth 1 -type f -name 'briite-*.zip' ! -name '*-wordpress-org.zip' -print -quit)"
          test -n "${THEME_ZIP}"
          wp theme install "${THEME_ZIP}" --force --activate --path=/tmp/wordpress

      - name: Create historical Kriate language pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wordpress/wp-content/languages/themes
          cat > /tmp/kriate-en_US.po <<'PO'
          msgid ""
          msgstr ""
          "Project-Id-Version: Briite Legacy Compatibility\n"
          "Language: en_US\n"
          "MIME-Version: 1.0\n"
          "Content-Type: text/plain; charset=UTF-8\n"
          "Content-Transfer-Encoding: 8bit\n"

          msgid "Primary Menu"
          msgstr "Legacy Primary Menu"
          PO

          wp i18n make-mo \
            /tmp/kriate-en_US.po \
            /tmp/wordpress/wp-content/languages/themes/kriate-en_US.mo

          test -s /tmp/wordpress/wp-content/languages/themes/kriate-en_US.mo
          test ! -e /tmp/wordpress/wp-content/languages/themes/briite-en_US.mo

      - name: Verify legacy pack loads into canonical Briite domain
        shell: bash
        run: |
          set -euo pipefail
          wp eval --path=/tmp/wordpress '
            if ( "briite" !== wp_get_theme()->get( "TextDomain" ) ) {
              fwrite( STDERR, "Briite theme metadata does not expose the canonical text domain.\n" );
              exit( 1 );
            }
            if ( ! function_exists( "briite_load_legacy_translation_fallback" ) ) {
              fwrite( STDERR, "Legacy translation fallback callback is missing.\n" );
              exit( 1 );
            }
            $translated = __( "Primary Menu", "briite" );
            if ( "Legacy Primary Menu" !== $translated ) {
              fwrite( STDERR, "Legacy Kriate language pack did not load into the briite domain. Got: {$translated}\n" );
              exit( 1 );
            }
          '
