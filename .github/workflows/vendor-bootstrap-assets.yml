name: Vendor exact Bootstrap assets

on:
  push:
    branches:
      - modernize/vendor-bootstrap-css

permissions:
  contents: write

jobs:
  vendor-bootstrap-assets:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Import and verify Bootstrap 3.3.7 assets
        shell: bash
        run: |
          set -euo pipefail

          download_verified() {
            local url="$1"
            local output="$2"
            local expected_blob="$3"

            mkdir -p "$(dirname "$output")"
            curl --fail --location --proto '=https' --tlsv1.2 "$url" --output "$output"

            local actual_blob
            actual_blob="$(git hash-object "$output")"
            if [[ "$actual_blob" != "$expected_blob" ]]; then
              echo "Blob mismatch for ${output}: expected ${expected_blob}, got ${actual_blob}" >&2
              exit 1
            fi
          }

          base_url='https://raw.githubusercontent.com/twbs/bootstrap/v3.3.7/dist'

          download_verified "$base_url/css/bootstrap.min.css" \
            'css/bootstrap-3.3.7.min.css' \
            'ed3905e0e0c91d4ed7d8aa14412dffeb038745ff'

          download_verified "$base_url/fonts/glyphicons-halflings-regular.eot" \
            'fonts/glyphicons-halflings-regular.eot' \
            'b93a4953fff68df523aa7656497ee339d6026d64'
          download_verified "$base_url/fonts/glyphicons-halflings-regular.svg" \
            'fonts/glyphicons-halflings-regular.svg' \
            '94fb5490a2ed10b2c69a4a567a4fd2e4f706d841'
          download_verified "$base_url/fonts/glyphicons-halflings-regular.ttf" \
            'fonts/glyphicons-halflings-regular.ttf' \
            '1413fc609ab6f21774de0cb7e01360095584f65b'
          download_verified "$base_url/fonts/glyphicons-halflings-regular.woff" \
            'fonts/glyphicons-halflings-regular.woff' \
            '9e612858f802245ddcbf59788a0db942224bab35'
          download_verified "$base_url/fonts/glyphicons-halflings-regular.woff2" \
            'fonts/glyphicons-halflings-regular.woff2' \
            '64539b54c3751a6d9adb44c8e3a45ba5a73b77f0'

          rm .github/workflows/vendor-bootstrap-assets.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Vendor exact Bootstrap 3.3.7 runtime assets'
          git push origin HEAD:modernize/vendor-bootstrap-css
