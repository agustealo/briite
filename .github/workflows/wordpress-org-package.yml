name: WordPress.org Package Gate

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: wordpress-org-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-runtime:
    name: WordPress.org package runtime
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
          tools: composer:v2,wp-cli

      - name: Build WordPress.org package
        run: composer package:wordpress-org

      - name: Verify WordPress.org artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          THEME_ZIP="$(find dist -maxdepth 1 -type f -name 'briite-*-wordpress-org.zip' -print -quit)"
          CHECKSUM_FILE="${THEME_ZIP}.sha256"

          test -n "${THEME_ZIP}"
          test -f "${CHECKSUM_FILE}"
          unzip -t "${THEME_ZIP}"

          (
            cd dist
            sha256sum -c "$(basename "${CHECKSUM_FILE}")"
          )

          PACKAGE_LIST="$(unzip -Z1 "${THEME_ZIP}")"
          grep -qxF 'briite/css/bootstrap-3.3.7.css' <<< "${PACKAGE_LIST}"
          grep -qxF 'briite/css/bootstrap-3.3.7.min.css' <<< "${PACKAGE_LIST}"
          grep -qxF 'briite/fonts/raleway-regular.woff' <<< "${PACKAGE_LIST}"
          grep -qxF 'briite/inc/i18n.php' <<< "${PACKAGE_LIST}"
          grep -qxF 'briite/languages/briite.pot' <<< "${PACKAGE_LIST}"

          if grep -qxF 'briite/languages/kriate.pot' <<< "${PACKAGE_LIST}"; then
            echo 'WordPress.org artifact contains the stale Kriate POT template.' >&2
            exit 1
          fi

          if ! unzip -p "${THEME_ZIP}" briite/style.css | grep -qxF 'Text Domain: briite'; then
            echo 'WordPress.org artifact does not declare the canonical briite text domain.' >&2
            exit 1
          fi

          if grep -Eq 'glyphicons-halflings-regular\.(eot|svg|ttf|woff|woff2)$' <<< "${PACKAGE_LIST}"; then
            echo 'WordPress.org artifact contains Glyphicon font files.' >&2
            exit 1
          fi

          if unzip -p "${THEME_ZIP}" briite/css/bootstrap-3.3.7.min.css | grep -Eq 'Glyphicons Halflings|glyphicons-halflings-regular'; then
            echo 'WordPress.org artifact contains a Glyphicon font reference.' >&2
            exit 1
          fi

      - name: Verify WordPress.org screenshot contract
        shell: bash
        run: |
          set -euo pipefail
          THEME_ZIP="$(find dist -maxdepth 1 -type f -name 'briite-*-wordpress-org.zip' -print -quit)"
          unzip -p "${THEME_ZIP}" briite/screenshot.png > /tmp/briite-screenshot.png
          SCREENSHOT_SIZE="$(stat -c '%s' /tmp/briite-screenshot.png)"
          test "${SCREENSHOT_SIZE}" -lt 500000

          python3 <<'PY'
          import struct
          from pathlib import Path

          png = Path('/tmp/briite-screenshot.png').read_bytes()
          if not png.startswith(b'\x89PNG\r\n\x1a\n') or png[12:16] != b'IHDR':
              raise SystemExit('Packaged screenshot is not a valid PNG with an IHDR header')

          width, height = struct.unpack('>II', png[16:24])
          if width > 1200 or height > 900:
              raise SystemExit(f'Packaged screenshot exceeds 1200x900: {width}x{height}')
          if width * 3 != height * 4:
              raise SystemExit(f'Packaged screenshot is not 4:3: {width}x{height}')

          print(f'Packaged screenshot: {width}x{height}')
          PY
          echo "Packaged screenshot size: ${SCREENSHOT_SIZE} bytes"

      - name: Upload WordPress.org package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: briite-wordpress-org-${{ github.sha }}
          path: |
            dist/briite-*-wordpress-org.zip
            dist/briite-*-wordpress-org.zip.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Install WordPress 7.1.1
        shell: bash
        run: |
          set -euo pipefail
          wp core download --version=7.1.1 --path=/tmp/wordpress --force
          wp config create \
            --path=/tmp/wordpress \
            --dbname=wordpress_test \
            --dbuser=wordpress \
            --dbpass=wordpress \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          wp core install \
            --path=/tmp/wordpress \
            --url=http://127.0.0.1:8080 \
            --title='Briite WordPress.org CI' \
            --admin_user=admin \
            --admin_password='briite-ci-password' \
            --admin_email=ci@example.com \
            --skip-email
          wp config set WP_DEBUG true --raw --path=/tmp/wordpress
          wp config set WP_DEBUG_LOG true --raw --path=/tmp/wordpress
          wp config set WP_DEBUG_DISPLAY false --raw --path=/tmp/wordpress

      - name: Install and activate WordPress.org Briite package
        shell: bash
        run: |
          set -euo pipefail
          THEME_ZIP="$(find dist -maxdepth 1 -type f -name 'briite-*-wordpress-org.zip' -print -quit)"
          test -n "${THEME_ZIP}"
          wp theme install "${THEME_ZIP}" --force --activate --path=/tmp/wordpress

      - name: Run Theme Check 20260821 against packaged Briite
        shell: bash
        run: |
          set -euo pipefail
          wp plugin install theme-check --version=20260821 --activate --path=/tmp/wordpress
          wp theme-check run briite --format=json --path=/tmp/wordpress | tee /tmp/briite-theme-check.json
          test -s /tmp/briite-theme-check.json

      - name: Verify preserved Briite contracts
        shell: bash
        run: |
          set -euo pipefail
          wp eval --path=/tmp/wordpress '
            if ( "Briite" !== wp_get_theme()->get( "Name" ) ) {
              fwrite( STDERR, "Unexpected active theme name.\n" );
              exit( 1 );
            }
            if ( "briite" !== wp_get_theme()->get( "TextDomain" ) ) {
              fwrite( STDERR, "Unexpected active theme text domain.\n" );
              exit( 1 );
            }
            if ( ! function_exists( "briite_load_legacy_translation_fallback" ) ) {
              fwrite( STDERR, "Briite translation compatibility loader is missing.\n" );
              exit( 1 );
            }
            if ( ! current_theme_supports( "title-tag" ) || ! current_theme_supports( "post-thumbnails" ) || ! current_theme_supports( "editor-styles" ) ) {
              fwrite( STDERR, "Required Briite theme support is missing.\n" );
              exit( 1 );
            }
            $menus = get_registered_nav_menus();
            if ( ! isset( $menus["primary"] ) ) {
              fwrite( STDERR, "Primary menu location is missing.\n" );
              exit( 1 );
            }
            global $wp_registered_sidebars;
            foreach ( array( "bottom-widget-1", "bottom-widget-2", "bottom-widget-3", "bottom-widget-4" ) as $sidebar_id ) {
              if ( ! isset( $wp_registered_sidebars[ $sidebar_id ] ) ) {
                fwrite( STDERR, "Historical widget area missing: {$sidebar_id}\n" );
                exit( 1 );
              }
            }
          '

      - name: Seed and render representative routes
        shell: bash
        run: |
          set -euo pipefail
          POST_ID=$(wp post create \
            --path=/tmp/wordpress \
            --post_type=post \
            --post_status=publish \
            --post_title='Briite WordPress.org Smoke Post' \
            --post_content='Briite WordPress.org package runtime content.' \
            --porcelain)
          PAGE_ID=$(wp post create \
            --path=/tmp/wordpress \
            --post_type=page \
            --post_status=publish \
            --post_title='Briite WordPress.org Smoke Page' \
            --post_content='Briite WordPress.org page runtime content.' \
            --porcelain)
          CATEGORY_ID=$(wp term create category 'Briite WordPress.org Category' \
            --path=/tmp/wordpress \
            --porcelain)
          wp post term add "${POST_ID}" category "${CATEGORY_ID}" --path=/tmp/wordpress

          php -S 127.0.0.1:8080 -t /tmp/wordpress >/tmp/briite-wordpress-org-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 20 ]; then
              cat /tmp/briite-wordpress-org-server.log
              exit 1
            fi
            sleep 1
          done

          routes=(
            "/"
            "/?p=${POST_ID}"
            "/?page_id=${PAGE_ID}"
            "/?s=Briite"
            "/?cat=${CATEGORY_ID}"
          )

          index=0
          for route in "${routes[@]}"; do
            output="/tmp/briite-wordpress-org-route-${index}.html"
            curl --fail --silent --show-error "http://127.0.0.1:8080${route}" > "${output}"
            grep -q '</html>' "${output}"
            grep -q '/js/theme.js' "${output}"
            grep -q '/css/bootstrap-3.3.7.min.css' "${output}"
            ! grep -q 'maxcdn.bootstrapcdn.com' "${output}"
            index=$(( index + 1 ))
          done

          curl --fail --silent --show-error \
            'http://127.0.0.1:8080/wp-content/themes/briite/css/bootstrap-3.3.7.min.css' \
            > /tmp/briite-wordpress-org-bootstrap.css
          grep -q 'Bootstrap v3.3.7' /tmp/briite-wordpress-org-bootstrap.css
          ! grep -Eq 'Glyphicons Halflings|glyphicons-halflings-regular' /tmp/briite-wordpress-org-bootstrap.css

          NOT_FOUND_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/briite-wordpress-org-404.html \
            --write-out '%{http_code}' \
            'http://127.0.0.1:8080/?p=999999')
          test "${NOT_FOUND_STATUS}" = '404'
          grep -q '</html>' /tmp/briite-wordpress-org-404.html

      - name: Fail on WordPress.org package diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/wordpress/wp-content/debug.log ] && [ -s /tmp/wordpress/wp-content/debug.log ]; then
            echo 'WordPress debug.log is not empty:'
            cat /tmp/wordpress/wp-content/debug.log
            exit 1
          fi

          if [ -f /tmp/briite-wordpress-org-server.log ] && grep -Eqi 'PHP (Warning|Notice|Deprecated|Fatal error|Parse error)|Uncaught (Error|Exception)' /tmp/briite-wordpress-org-server.log; then
            echo 'PHP runtime diagnostics detected:'
            cat /tmp/briite-wordpress-org-server.log
            exit 1
          fi
